{% extends "catalog/base_pattern.html" %}
{% load my_tags %}
{% block content %}
    <div class="col-1"></div>
    <div class="col-9">
        <div class="container mt-5">
            <h1>Создание продукта</h1>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </form>
        </div>
    </div>
{% endblock %}
