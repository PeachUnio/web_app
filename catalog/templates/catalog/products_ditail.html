{% extends "catalog/base_pattern.html" %}
{% load my_tags %}
{% block content %}
    <div class="col-1"></div>
    <div class="col-9">
        <div class="mt-5"></div>
        <h1 class="text-center">{{ product.name }}</h1>
        <div class="mt-3"></div>
        <h5 class="text-center text-secondary">{{ product.description }}</h5>
        <div class="mt-9"></div>
        <div class="card mx-auto text-center" style="width: 60rem;">
            <img src="{{ product.image|media_filter }}" class="card-img-top">
            <div class="card-body">
                <h5 class="card-title">₽ {{ product.cost }}</h5>
                <p class="card-text">{{ product.category }}</p>
                <p class="card-text text-end"><small class="text-body-secondary">продукт создан: {{ product.created_at|date:"d M Y" }}</small></p>
                <p class="card-text text-end"><small class="text-body-secondary">продукт изменен: {{ product.updated_at|date:"d M Y" }}</small></p>
            </div>
        </div>
    </div>
{% endblock %}
