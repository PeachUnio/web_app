[project]
name = "web_app"
version = "0.1.0"
description = ""
authors = [
    {name = "Арина Новгородова",email = "arrrishanov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "ipython (>=9.7.0,<10.0.0)",
    "django (==4.2.2)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 119
exclude = '''
/(
    \.git
    | \.venv
    | venv
)/'''

[tool.isort]
line_length = 119
