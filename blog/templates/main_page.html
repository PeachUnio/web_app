{% extends "basa.html" %}
{% load my_tags %}
{% block content %}
    <div class="col-12">
        <div class="mt-5"></div>
        <h1 class="text-center">Главная</h1>
        <div class="mt-3"></div>
        <div class="row">
            <div class="col-5"></div>
            <div class="col-2">
                <p>
                    <a href="{% url 'blog:publications_create' %}" class="w-100 btn btn-lg btn-outline-primary">создать публикацию</a>
                </p>
            </div>
            <div class="mt-3"></div>
            <div class="col-5"></div>
        </div>
        <div class="row row-cols-1 row-cols-md-2 g-4">
            {% for publication in object_list %}
            <div class="col">
                <div class="card" style="width: 30rem;">
                    <img src="{{ publication.image|media_filter }}" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">{{ publication.title }}</h5>
                        <p class="card-text">{{ publication.content }}</p>
                        <p class="card-text text-end"><small class="text-body-secondary">{{ publication.views_count }}</small></p>
                        <div class="btn-group" role="group" aria-label="Basic outlined example">
                            <div class="btn-group" role="group" aria-label="Basic outlined example">
                                <a href="{% url 'blog:publications_ditail' pk=publication.id %}" class="btn btn-primary">детали</a>
                                <a href="{% url 'blog:publications_update' publication.id %}" class="btn btn-secondary">редактировать</a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
