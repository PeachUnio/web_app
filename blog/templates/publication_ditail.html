{% extends "basa.html" %}
{% load my_tags %}
{% block content %}
    <div class="col-1"></div>
    <div class="col-9">
        <div class="mt-5"></div>
        <h1 class="text-center">{{ publication.title }}</h1>
        <div class="mt-3"></div>
        <h5 class="text-center text-secondary">{{ publication.content }}</h5>
        <div class="mt-9"></div>
        <div class="card mx-auto text-center" style="width: 60rem;">
            <img src="{{ publication.image|media_filter }}" class="card-img-top">
            <div class="card-body">
                <p class="card-text text-end"><small class="text-body-secondary">опубликовано: {{ publication.created_at|date:"d M Y" }}</small></p>
                <p class="card-text text-end"><small class="text-body-secondary">просмотры: {{ product.views_count }}</small></p>
            </div>
            <p>
                <a href="{% url 'blog:main_page' %}" class="w-100 btn btn-lg btn-outline-primary">назад</a>
            </p>
            <p>
                <a href="{% url 'blog:publications_delete' publication.id %}" class="w-100 btn btn-lg btn-outline-danger">удалить</a>
            </p>
        </div>
    </div>
{% endblock %}
